<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입장 검표</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; }
    #reader { width: 100%; max-width: 360px; margin: 0 auto; }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 16px;
      border-radius: 8px;
      min-height: 24px;
    }
    .ok { background: #e6f7e9; color: #1a7a34; }
    .already { background: #fff4e5; color: #b45f06; }
    .notfound, .error { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <h2>입장 검표</h2>
  <div id="reader"></div>
  <div id="result">카메라 준비 중...</div>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyz2WxTU0SjOeqsgGygPs1U9KJTHYjjMMuGYH_5ggGZx-tZg51MvWMXnXHWRWNtKbwc/exec';
    const APP_SECRET = '1a8f4f8d3e9t02fs';

    let processing = false;
    let lastDecodedText = null;
    let lastDecodedAt = 0;

    // [변경] Html5QrcodeScanner(UI 위젯) -> Html5Qrcode(저수준 클래스)로 교체.
    // Html5QrcodeScanner는 "한 번 스캔하고 끝나는" 단발성 UI 컴포넌트라
    // 스캔 성공 후 내부적으로 UI를 다시 그리면서 비디오 스트림이 깨지는
    // 알려진 문제가 있음. 검표 앱처럼 계속 여러 번 스캔해야 하는 경우엔
    // Html5Qrcode.start()로 카메라를 한 번만 켜고, stop() 부르기 전까지는
    // 절대 멈추지 않는 저수준 API를 쓰는 게 정석.
    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (processing) return; // 현재 처리 중이면 무시
      if (decodedText === lastDecodedText && now - lastDecodedAt < 3000) return; // 같은 코드 연속 인식 무시

      processing = true;
      lastDecodedText = decodedText;
      lastDecodedAt = now;

      const resultEl = document.getElementById('result');
      resultEl.className = '';
      resultEl.innerText = '확인 중...';

      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ reservationId: decodedText, secret: APP_SECRET }),
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          resultEl.className = res.result;
          resultEl.innerText = res.message;
        })
        .catch(function (err) {
          resultEl.className = 'error';
          resultEl.innerText = '오류가 발생했습니다: ' + err.message;
        })
        .finally(function () {
          setTimeout(function () {
            processing = false;
          }, 800);
        });
    }

    function onScanFailure() {
      // 매 프레임마다 QR을 못 찾으면 호출되는 정상적인 콜백이라 조용히 무시함
    }

    function qrboxFunction(viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const size = Math.floor(minEdge * 0.7);
      return { width: size, height: size };
    }

    const html5QrCode = new Html5Qrcode('reader');

    // facingMode: "environment" -> 후면 카메라 우선 사용 (검표 현장에서 필요한 방향)
    html5QrCode
      .start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: qrboxFunction },
        onScanSuccess,
        onScanFailure
      )
      .then(function () {
        document.getElementById('result').innerText = '';
      })
      .catch(function (err) {
        document.getElementById('result').className = 'error';
        document.getElementById('result').innerText = '카메라를 시작할 수 없습니다: ' + err;
      });

    // 페이지를 벗어나거나 새로고침할 때 카메라 스트림을 깔끔하게 정리
    window.addEventListener('beforeunload', function () {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(function () {});
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입장 검표</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; }
    #reader { width: 100%; max-width: 360px; margin: 0 auto; }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 16px;
      border-radius: 8px;
      min-height: 24px;
    }
    .ok { background: #e6f7e9; color: #1a7a34; }
    .already { background: #fff4e5; color: #b45f06; }
    .notfound, .error { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <h2>입장 검표</h2>
  <div id="reader"></div>
  <div id="result"></div>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyz2WxTU0SjOeqsgGygPs1U9KJTHYjjMMuGYH_5ggGZx-tZg51MvWMXnXHWRWNtKbwc/exec';
    const APP_SECRET = '1a8f4f8d3e9t02fs';

    let processing = false;
    let lastDecodedText = null;
    let lastDecodedAt = 0;

    // [변경] pause(true)/resume() 조합을 제거함.
    // html5-qrcode 라이브러리는 pause(true)로 비디오 스트림까지 같이 멈추면
    // resume()이 카메라를 제대로 다시 살리지 못하는 알려진 버그가 있음
    // (특히 iOS Safari). 그래서 첫 스캔 이후 화면이 정지 프레임처럼 굳어버려
    // 그 뒤로는 아무것도 인식이 안 되는 증상이 생김.
    //
    // -> 카메라는 계속 켜둔 채로, "처리 중이거나 방금 처리한 같은 코드"인
    // 경우만 무시하는 방식으로 바꿈. 카메라 자체를 멈췄다 켰다 하지 않으므로
    // 이 버그를 원천적으로 피함.
    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (processing) return; // 현재 처리 중이면 무시

      // 같은 QR을 연속 프레임에서 계속 읽어들이는 것 방지 (쿨다운 내 동일 코드 무시)
      if (decodedText === lastDecodedText && now - lastDecodedAt < 3000) return;

      processing = true;
      lastDecodedText = decodedText;
      lastDecodedAt = now;

      const resultEl = document.getElementById('result');
      resultEl.className = '';
      resultEl.innerText = '확인 중...';

      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ reservationId: decodedText, secret: APP_SECRET }),
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          resultEl.className = res.result;
          resultEl.innerText = res.message;
        })
        .catch(function (err) {
          resultEl.className = 'error';
          resultEl.innerText = '오류가 발생했습니다: ' + err.message;
        })
        .finally(function () {
          // 카메라/스캔 루프는 건드리지 않고 processing 플래그만 풀어줌.
          // 짧게 딜레이를 둬서 같은 프레임에서 재요청이 바로 안 나가게 함.
          setTimeout(function () {
            processing = false;
          }, 800);
        });
    }

    function qrboxFunction(viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const size = Math.floor(minEdge * 0.7);
      return { width: size, height: size };
    }

    const scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: qrboxFunction });
    scanner.render(onScanSuccess, function (errorMessage) {
      // 매 프레임마다 QR을 못 찾으면 호출되는 정상적인 콜백이라 조용히 무시함
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입장 검표</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; }
    #reader { width: 100%; max-width: 360px; margin: 0 auto; }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 16px;
      border-radius: 8px;
      min-height: 24px;
    }
    .ok { background: #e6f7e9; color: #1a7a34; }
    .already { background: #fff4e5; color: #b45f06; }
    .notfound, .error { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <h2>입장 검표</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>

    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyz2WxTU0SjOeqsgGygPs1U9KJTHYjjMMuGYH_5ggGZx-tZg51MvWMXnXHWRWNtKbwc/exec';


    const APP_SECRET = '1a8f4f8d3e9t02fs';

    let processing = false;

    function onScanSuccess(decodedText) {
      if (processing) return; // 스캔 중 중복 호출 방지
      processing = true;

      const resultEl = document.getElementById('result');
      resultEl.className = '';
      resultEl.innerText = '확인 중...';

 
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ reservationId: decodedText, secret: APP_SECRET }),
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          resultEl.className = res.result;
          resultEl.innerText = res.message;
          setTimeout(function () { processing = false; }, 1500); // 재스캔 쿨다운
        })
        .catch(function (err) {
          resultEl.className = 'error';
          resultEl.innerText = '오류가 발생했습니다: ' + err.message;
          processing = false;
        });
    }

    const scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess);
  </script>
</body>
</html>

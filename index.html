<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好きにしろ</title>
<style>
  *{box-sizing:border-box}

  :root{
    --navy:#183b68;
    --navy-dark:#102d50;
    --red:#9d3428;
    --paper:#e8cda5;
    --paper-light:#f4dfbc;
    --ink:#111;
  }

  html,body{min-height:100%;margin:0}

  body{
    min-height:100vh;
    min-height:100dvh;
    display:block;
    overflow-x:hidden;
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 25%),
      radial-gradient(circle at 80% 80%,rgba(130,75,30,.10),transparent 28%),
      repeating-linear-gradient(0deg,rgba(80,45,15,.025) 0 1px,transparent 1px 4px),
      var(--paper);
  }

  /* 오래된 인쇄물 같은 종이 질감 */
  body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background-image:
      radial-gradient(circle,rgba(20,35,55,.35) 0 .6px,transparent .8px);
    background-size:7px 7px;
    mix-blend-mode:multiply;
  }

  .wrap{
    position:relative;
    width:min(100% - 32px,720px);
    min-height:100vh;
    min-height:100dvh;
    margin:0 auto;
    padding:42px 28px 20px;
    text-align:center;
  }

  /* 상단 장식 */
  .wrap:before,
  .wrap:after{
    content:"★";
    position:absolute;
    top:48px;
    color:var(--red);
    font-size:20px;
    transform:rotate(-10deg);
  }
  .wrap:before{left:8px}
  .wrap:after{right:8px;transform:rotate(10deg)}

  .logo{
    width:128px;
    height:128px;
    padding:6px;
    border-radius:50%;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 22px;
    background:transparent;
    border:0;
    box-shadow:none;
  }

  .logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  h1{
    position:relative;
    display:inline-block;
    color:var(--navy);
    font-size:clamp(34px,7vw,52px);
    font-weight:900;
    letter-spacing:-2px;
    margin:0 0 12px;
    line-height:1.1;
    text-shadow:1px 1px 0 rgba(255,255,255,.35);
  }

  h1:before,
  h1:after{
    content:"";
    position:absolute;
    top:50%;
    width:42px;
    height:4px;
    background:var(--red);
  }
  h1:before{right:100%;margin-right:18px}
  h1:after{left:100%;margin-left:18px}

  .desc{
    color:var(--navy);
    font-size:15px;
    margin:0 0 32px;
    font-weight:500;
    letter-spacing:-.3px;
  }

  .links{
    display:grid;
    gap:18px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:76px;
    padding:18px 24px;
    border:3px solid var(--navy);
    border-radius:12px;
    background:
      repeating-linear-gradient(0deg,rgba(40,25,10,.025) 0 1px,transparent 1px 4px),
      rgba(246,234,211,.82);
    color:var(--navy-dark);
    text-decoration:none;
    font-weight:900;
    font-size:19px;
    letter-spacing:-.5px;
    box-shadow:
      0 5px 0 var(--navy-dark),
      0 9px 16px rgba(35,35,25,.12);
    transition:transform .12s,box-shadow .12s,background .12s;
  }

  .btn:before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(18,59,115,.25);
    border-radius:7px;
    pointer-events:none;
  }

  .btn:hover{
    transform:translateY(-2px);
    background:rgba(255,244,222,.96);
    box-shadow:
      0 7px 0 var(--navy-dark),
      0 12px 20px rgba(35,35,25,.15);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--navy-dark);
  }

  .copyright{
    text-align:center;
    margin-top:28px;
    color:#a83222;
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
  }

  @media (max-width:560px){
    .wrap{
      width:min(100% - 20px,720px);
      min-height:100dvh;
      padding:30px 18px 18px;
    }
    .wrap:before,.wrap:after{display:none}
    .logo{width:104px;height:104px;padding:5px;margin-bottom:18px}
    h1{font-size:36px}
    h1:before,h1:after{width:25px}
    h1:before{margin-right:10px}
    h1:after{margin-left:10px}
    .desc{font-size:14px;margin-bottom:26px}
    .btn{min-height:66px;font-size:17px}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">
    <img src="logo3.png" alt="로고">
  </div>
  
  <h1>好きにしろ</h1>
  <p class="desc">원하시는 예매 방법을 선택해주세요.</p>

  <div class="links">
    <a class="btn" href="https://dudoong.com/events/1760" target="_blank" rel="noopener">
      두둥에서 예매
    </a>

    <a class="btn" href="https://docs.google.com/forms/d/1VqVBAYOnSsEflVIsLHrH_mEHFLqeIv4HQcHV2ikPb8k/viewform" target="_blank" rel="noopener">
      구글 Form에서 예매
    </a>

    <a class="btn" href="https://open.kakao.com/o/skeV20Ki" target="_blank" rel="noopener">
      Q&A 문의
    </a>
   
  </div>

  <div class="copyright">© 好きにしろ</div>
</main>
</body>
</html>

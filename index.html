<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好きにして</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f5; color:#222;
  }
  .wrap{width:100%;max-width:520px;padding:48px 20px}
  .logo{
    width:88px;height:88px;border-radius:24px;background:#222;color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    font-weight:700;font-size:15px;
  }
  h1{text-align:center;font-size:26px;margin:0 0 8px}
  .desc{text-align:center;color:#777;font-size:14px;margin:0 0 30px}
  .links{display:grid;gap:14px}
  .btn{
    display:flex;align-items:center;justify-content:center;min-height:58px;
    padding:16px 20px;border-radius:16px;background:#fff;color:#222;
    text-decoration:none;font-weight:700;font-size:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
    transition:transform .12s,box-shadow .12s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.11)}
  .footer{text-align:center;color:#aaa;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">LOGO</div>
  <h1>好きにして</h1>
  <p class="desc">원하는 결제 방법을 선택해주세요.</p>

  <div class="links">
    <a class="btn" href="https://dudoong.com/events/1760" target="_blank" rel="noopener">
      두둥에서 결제
    </a>

    <a class="btn" href="https://docs.google.com/forms/d/1VqVBAYOnSsEflVIsLHrH_mEHFLqeIv4HQcHV2ikPb8k/viewform" target="_blank" rel="noopener">
      구글 FOAM에서 결제
    </a>
  </div>

  <div class="footer">© 好きにして</div>
</main>
</body>
</html>
